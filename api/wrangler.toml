name = "scorestep-ai-gateway"
main = "worker.js"
compatibility_date = "2026-09-27"

# Cloudflare Workers AI binding (free daily allocation: 10,000 Neurons/day).
# On the Workers Free plan, requests fail after the daily allocation instead of being billed.
[ai]
binding = "AI"

[vars]
ALLOWED_ORIGINS = "https://giver11.github.io"
AI_MODEL = "@cf/openai/gpt-oss-120b"
AI_MAX_TOKENS = "800"
# Server-side speech-to-text fallback for browsers with no native SpeechRecognition
# (iOS Safari/WKWebView, inconsistent Android WebView) — same free Workers AI allocation, no paid API.
STT_MODEL = "@cf/openai/whisper-large-v3-turbo"
