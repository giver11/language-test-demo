<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HSK ScoreStep</title><link rel="stylesheet" href="../study.css"></head><body><div id="gate" class="gate"><form id="gateForm" class="gate-card"><div class="brand">S<span>∞</span> <b id="gateName"></b></div><p class="eyebrow">PRIVATE BETA</p><h1 id="gateSubtitle"></h1><label>테스트 코드<input id="accessCode" placeholder="초대 코드"></label><button class="primary">무료로 시작하기</button><p id="gateError" class="error"></p></form></div><div id="app" class="app hidden"><aside><a href="../">← 앱 선택</a><div class="brand">S<span>∞</span> <b id="appName"></b></div><nav><button class="nav active" data-view="home">⌂ <span>오늘의 학습</span></button><button class="nav" data-view="practice">◉ <span>따라 말하기</span></button><button class="nav" data-view="progress">↗ <span>학습 기록</span></button></nav><div class="streak">🔥 오늘도 학습 중</div></aside><main><header><div><p class="eyebrow">DAILY STUDY PLAN</p><h2>今天也进步一点</h2></div></header><section id="home" class="view active"><div id="tracks" class="tracks"></div><div class="hero"><div><span id="tag" class="badge"></span><h1 id="title"></h1><p id="desc"></p></div><div class="ring"><b id="xp">0</b><small>오늘 XP</small></div></div><div class="section-head"><p class="eyebrow">TODAY</p><h3>오늘의 핵심 훈련</h3></div><div id="lessons" class="lesson-grid"></div></section><section id="practice" class="view"><p class="eyebrow">SPEAK & SHADOW</p><h2>성조까지 정확하게 따라 말하기</h2><div class="practice-card"><div class="speaker"><button class="voice active" data-gender="0">👨 남성 음성</button><button class="voice" data-gender="1">👩 여성 음성</button></div><span id="practiceTag" class="badge"></span><h2 id="sentence"></h2><p id="translation" class="muted"></p><div class="controls"><button id="listen" class="secondary">▶ 듣기</button><button id="record" class="primary">● 따라 말하기</button></div><div id="feedback" class="feedback"></div><button id="next" class="ghost">다음 문장 →</button></div></section><section id="progress" class="view"><p class="eyebrow">PROGRESS</p><h2>HSK 학습 기록</h2><div class="stats"><div class="stat"><b id="xpStat">0</b><span>총 XP</span></div><div class="stat"><b id="doneStat">0</b><span>완료 학습</span></div><div class="stat"><b id="bestStat">—</b><span>최근 발음</span></div></div><div class="notice">기록은 HSK 앱에만 저장됩니다.</div></section></main></div><script>window.APP_DATA={id:'hsk',name:'HSK',subtitle:'중국어 시험을 위한 매일 10분',lang:'zh-CN',tracks:{basic:{name:'HSK 1–3',tag:'HSK BASIC',desc:'기초 단어, 성조, 생활 회화를 탄탄히 익힙니다.',lessons:[['🀄','기초 어휘','급수별 핵심 단어','8분'],['🎵','성조 훈련','4성과 경성 구별','8분'],['🎧','짧은 듣기','일상 대화의 핵심 찾기','10분']],sentences:[['我每天早上七点起床。','저는 매일 아침 7시에 일어납니다.'],['请问，去火车站应该坐哪路公交车？','실례합니다. 기차역에는 몇 번 버스를 타야 하나요?']]},middle:{name:'HSK 4–6',tag:'HSK INTERMEDIATE',desc:'복합 문장과 사회·문화 주제의 독해를 훈련합니다.',lessons:[['📚','중급 어휘','문맥으로 단어 익히기','10분'],['🎧','듣기 집중','긴 대화의 태도 파악','12분'],['✍️','문장 쓰기','제시어로 문장 완성','12분']],sentences:[['学习语言需要每天坚持练习。','언어 학습은 매일 꾸준히 연습해야 합니다.'],['这个问题比我们想象的复杂得多。','이 문제는 우리가 생각한 것보다 훨씬 복잡합니다.']]},advanced:{name:'HSK 7–9',tag:'HSK ADVANCED',desc:'학술·전문 주제의 고급 독해, 번역, 작문을 연습합니다.',lessons:[['🧠','고급 어휘','성어와 전문 표현','12분'],['📰','심화 독해','논설문의 관점 분석','15분'],['📝','요약 작문','핵심 논지를 재구성','18분']],sentences:[['随着科技的发展，人们的生活方式发生了很大变化。','과학기술의 발전에 따라 생활 방식이 크게 변했습니다.'],['只有充分考虑各种因素，才能作出合理的判断。','여러 요소를 충분히 고려해야 합리적으로 판단할 수 있습니다.']]}}}</script><script src="../study.js"></script></body></html>
