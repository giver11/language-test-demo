# 실제 배포 URL 검증: GitHub Pages 배포가 끝나면(deployment_status) 실제 주소와 실제 Cloudflare Workers AI 로 테스트.
# PC Chrome 없이도 스마트폰에서 GitHub 의 Actions 탭으로 결과를 확인할 수 있다.
# AI 대화 테스트는 무료 한도를 아끼기 위해 v2/ 또는 api/ 가 바뀐 배포 · 매일 1회 · 수동 실행에서만 돈다.
name: Live check (GitHub Pages + Workers AI)
on:
  deployment_status:
  schedule:
    - cron: '17 0 * * *'   # 매일 09:17 KST
  workflow_dispatch:
    inputs:
      run_ai:
        description: '실제 AI 대화 테스트 실행'
        type: boolean
        default: true
concurrency:
  group: live
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  live:
    if: github.event_name != 'deployment_status' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'github-pages')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Playwright (Chromium)
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Decide AI test
        id: ai
        run: |
          RUN=0
          if [ "${{ github.event_name }}" = "schedule" ]; then RUN=1; fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.run_ai }}" = "true" ]; then RUN=1; fi
          if [ "${{ github.event_name }}" = "deployment_status" ] && git diff --name-only HEAD~1 HEAD | grep -qE '^(v2/|api/|tests/live_smoke.py)'; then RUN=1; fi
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          echo "RUN_AI=$RUN"
      - name: Wait for Pages CDN
        run: sleep 45
      - name: Live smoke test (실제 URL · CORS · 모바일 · AI)
        env:
          RUN_AI: ${{ steps.ai.outputs.run }}
        run: bash tests/run_annotated.sh python tests/live_smoke.py https://giver11.github.io/language-test-demo/
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-results
          path: tests/last-live-result.json
          if-no-files-found: ignore
