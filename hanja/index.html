<div id="fatal" role="alert"></div>
<script>
/* 오류가 나면 빈 화면 대신 화면에 원인을 표시 (모바일에서 확인 가능) */
(function () {
  var V = '2026.09.29-1';
  function show(msg) {
    var f = document.getElementById('fatal');
    if (!f) return;
    f.style.display = 'block';
    f.innerHTML = '앱 오류: ' + String(msg).replace(/[<>&]/g, '') + '<br><a href="#/diag" style="color:#fff;text-decoration:underline">진단 화면 열기</a> · <a href="javascript:location.reload()" style="color:#fff;text-decoration:underline">새로고침</a>';
  }
  window.__showFatal = show;
  /* 글자 크기(접근성) */
  try { var fs = localStorage.getItem('hanja.fontScale'); if (fs) document.documentElement.setAttribute('data-fs', fs); } catch (e) {}
  /* 오프라인 캐시 (지원 브라우저만) */
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  window.addEventListener('error', function (e) { if (e && e.message) show(e.message); });
  window.addEventListener('unhandledrejection', function (e) { show((e.reason && (e.reason.message || e.reason)) || '알 수 없는 오류'); });
  /* 오래된 캐시가 섞였을 때 자동 갱신: 배포 버전이 다르면 파일을 새로 받아 한 번 다시 연다 */
  try {
    fetch('version.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (j) {
      if (j.v !== V && !sessionStorage.getItem('hp-upd-' + j.v)) {
        sessionStorage.setItem('hp-upd-' + j.v, '1');
        Promise.all(j.files.map(function (f) { return fetch(f, { cache: 'reload' }).catch(function () {}); })).then(function () { location.reload(); });
      }
    }).catch(function () {});
  } catch (e) {}
  setTimeout(function () {
    var v = document.getElementById('view');
    if (v && /불러오는 중/.test(v.textContent) && !window.__hanjaReady) show('앱을 불러오지 못했어요. 인터넷 연결을 확인하거나 최신 Chrome·Safari에서 열어 주세요.');
  }, 12000);
})();
</script>
<script nomodule>document.getElementById('view').innerHTML = '<div class="notice bad">이 브라우저는 너무 오래되어 앱을 실행할 수 없어요. 최신 Chrome 또는 Safari에서 열어 주세요.</div>';</script>
